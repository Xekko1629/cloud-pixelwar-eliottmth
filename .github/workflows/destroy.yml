name: Destroy

# Manual only. Type the environment name in "confirm" to proceed.
# Serverless first, then runners in prd, then foundation.
# Always on GitHub-hosted runners; bootstrap, iam (secrets, state bucket, APIs) and access are preserved.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to destroy (application secrets are kept, they live in infra/iam)
        type: choice
        options: [dev, prd]
        default: dev
      confirm:
        description: Type the environment name again to confirm deletion
        type: string
        required: true

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "$ENVIRONMENT" ]; then
            echo "::error::Confirmation '$CONFIRM' does not match environment '$ENVIRONMENT'"
            exit 1
          fi

  destroy-serverless:
    needs: confirm
    uses: ./.github/workflows/_destroy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}
      stack: serverless
      runner: ubuntu-latest

  destroy-runners:
    needs: destroy-serverless
    if: inputs.environment == 'prd'
    uses: ./.github/workflows/_destroy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prd
      stack: runners
      runner: ubuntu-latest
      github_app: true

  destroy:
    needs: [confirm, destroy-serverless, destroy-runners]
    # destroy-runners is skipped in dev
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/_destroy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}
      stack: foundation
      runner: ubuntu-latest
