name: Security

# No secret in the repository (gitleaks), on every PR: the whole history is scanned, since a
# secret added then removed stays in its commits. The binary is a release pinned by version
# and checked against its SHA-256 before it runs.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label (empty = RUNNER_SMALL variable, then ubuntu-latest)
        type: string
        default: ""

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ${{ inputs.runner || vars.RUNNER_SMALL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      # Known false positives are listed, with their reason, in .gitleaksignore.
      - name: Scan the history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1'
