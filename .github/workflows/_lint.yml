name: TFLint

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label (empty = RUNNER_SMALL variable, then ubuntu-latest)
        type: string
        default: ""

env:
  TFLINT_VERSION: "v0.64.0"

permissions:
  contents: read

jobs:
  lint:
    name: tflint
    runs-on: ${{ inputs.runner || vars.RUNNER_SMALL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
          cache: true

      # Downloads the plugins listed in .tflint.hcl (the token avoids the GitHub API rate limit)
      - name: Init plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # With --recursive, tflint looks for the config in each module: pass the root one by absolute path
      - name: Lint every stack
        run: tflint --recursive --chdir=infra --config="$GITHUB_WORKSPACE/.tflint.hcl" --format=compact
