name: Terraform validate

on:
  workflow_call:
    inputs:
      stacks:
        description: JSON list of stack directories under infra/
        type: string
        default: '["foundation", "iam", "runners"]'
      runner:
        description: Runner label (empty = RUNNER_LABEL variable, then ubuntu-latest)
        type: string
        default: ""

env:
  TF_VERSION: "1.17.0"

jobs:
  validate:
    name: validate (${{ matrix.stack }})
    runs-on: ${{ inputs.runner || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(inputs.stacks) }}
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # The wrapper is a Node.js script; self-hosted runner images have no node in PATH
          terraform_wrapper: false

      - name: Init without backend
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate
