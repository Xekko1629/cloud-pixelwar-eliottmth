name: Deploy

# Tag v*: checks, apply dev, then apply prd.
# Manual run from any branch: checks, apply dev only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label (empty = RUNNER_LABEL variable, then ubuntu-latest)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  fmt:
    uses: ./.github/workflows/_fmt.yml
    with:
      runner: ${{ inputs.runner }}

  validate:
    uses: ./.github/workflows/_validate.yml
    with:
      runner: ${{ inputs.runner }}

  test:
    uses: ./.github/workflows/_test.yml
    with:
      runner: ${{ inputs.runner }}

  apply-dev:
    needs: [fmt, validate, test]
    uses: ./.github/workflows/_apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev
      runner: ${{ inputs.runner }}

  apply-prd:
    needs: apply-dev
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/_apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prd
