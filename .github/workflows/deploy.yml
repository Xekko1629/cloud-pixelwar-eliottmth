name: Deploy

# Tag v*: foundation + bootstrap, then functions, then Gateway, then frontend, dev before prd.
# The frontend image is built once (frontend-image) and the same digest is deployed to both.
# Runners prd only depend on foundation. Manual runs deploy dev only.
# bootstrap (release artefacts) is applied here but never destroyed; iam and access are applied by hand.
# Applies stay on GitHub-hosted runners, independent of the infrastructure being changed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label (empty = RUNNER_MEDIUM variable, then ubuntu-latest)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  fmt:
    uses: ./.github/workflows/_fmt.yml
    with:
      runner: ${{ inputs.runner }}

  lint:
    uses: ./.github/workflows/_lint.yml
    with:
      runner: ${{ inputs.runner }}

  validate:
    uses: ./.github/workflows/_validate.yml
    with:
      runner: ${{ inputs.runner }}

  test:
    uses: ./.github/workflows/_test.yml
    with:
      runner: ${{ inputs.runner }}

  frontend-image:
    uses: ./.github/workflows/_frontend-image.yml

  apply-dev:
    needs: [fmt, lint, validate, test]
    uses: ./.github/workflows/_apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev
      stack: foundation
      runner: ubuntu-latest

  apply-bootstrap-dev:
    needs: [fmt, lint, validate, test]
    uses: ./.github/workflows/_apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev
      stack: bootstrap
      runner: ubuntu-latest

  apply-serverless-dev:
    needs: [apply-dev, apply-bootstrap-dev]
    uses: ./.github/workflows/_apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev
      stack: serverless
      runner: ubuntu-latest

  apply-gateway-dev:
    needs: apply-serverless-dev
    uses: ./.github/workflows/_apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev
      stack: gateway
      runner: ubuntu-latest

  apply-frontend-dev:
    needs: [apply-gateway-dev, frontend-image]
    uses: ./.github/workflows/_apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev
      stack: frontend
      runner: ubuntu-latest

  # SEC-01: nothing public once dev is deployed (frontend excepted)
  no-public-dev:
    needs: apply-frontend-dev
    uses: ./.github/workflows/_no-public.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev

  apply-prd:
    # A public resource in dev blocks the release to prd
    needs: [apply-frontend-dev, no-public-dev]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/_apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prd
      stack: foundation
      runner: ubuntu-latest

  apply-bootstrap-prd:
    # A public resource in dev blocks the release to prd
    needs: [apply-frontend-dev, no-public-dev]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/_apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prd
      stack: bootstrap
      runner: ubuntu-latest

  apply-serverless-prd:
    needs: [apply-prd, apply-bootstrap-prd]
    uses: ./.github/workflows/_apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prd
      stack: serverless
      runner: ubuntu-latest

  apply-runners-prd:
    needs: apply-prd
    uses: ./.github/workflows/_apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prd
      stack: runners
      runner: ubuntu-latest
      github_app: true

  apply-gateway-prd:
    needs: apply-serverless-prd
    uses: ./.github/workflows/_apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prd
      stack: gateway
      runner: ubuntu-latest

  apply-frontend-prd:
    needs: [apply-gateway-prd, frontend-image]
    uses: ./.github/workflows/_apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prd
      stack: frontend
      runner: ubuntu-latest

  no-public-prd:
    needs: [apply-frontend-prd, apply-runners-prd]
    uses: ./.github/workflows/_no-public.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prd

  # Architecture diagram of the released code, kept with the run (no commit, no write permission).
  diagram:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render the diagram
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q graphviz
          pip install --quiet diagrams==0.25.1
          python docs/architecture/diagram.py --check
          python docs/architecture/diagram.py
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-${{ github.ref_name }}
          path: |
            docs/architecture/*.png
            docs/architecture/architecture.json
