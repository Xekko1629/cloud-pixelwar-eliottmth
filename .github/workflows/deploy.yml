name: Deploy

# Tag v*: foundation + bootstrap, then functions, then Gateway, dev before prd.
# Runners prd only depend on foundation. Manual runs deploy dev only.
# bootstrap (release artefacts) is applied here but never destroyed; iam and access are applied by hand.
# Applies stay on GitHub-hosted runners, independent of the infrastructure being changed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label (empty = RUNNER_LABEL variable, then ubuntu-latest)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  fmt:
    uses: ./.github/workflows/_fmt.yml
    with:
      runner: ${{ inputs.runner }}

  lint:
    uses: ./.github/workflows/_lint.yml
    with:
      runner: ${{ inputs.runner }}

  validate:
    uses: ./.github/workflows/_validate.yml
    with:
      runner: ${{ inputs.runner }}

  test:
    uses: ./.github/workflows/_test.yml
    with:
      runner: ${{ inputs.runner }}

  apply-dev:
    needs: [fmt, lint, validate, test]
    uses: ./.github/workflows/_apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev
      stack: foundation
      runner: ubuntu-latest

  apply-bootstrap-dev:
    needs: [fmt, lint, validate, test]
    uses: ./.github/workflows/_apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev
      stack: bootstrap
      runner: ubuntu-latest

  apply-serverless-dev:
    needs: [apply-dev, apply-bootstrap-dev]
    uses: ./.github/workflows/_apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev
      stack: serverless
      runner: ubuntu-latest

  apply-gateway-dev:
    needs: apply-serverless-dev
    uses: ./.github/workflows/_apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev
      stack: gateway
      runner: ubuntu-latest

  apply-prd:
    needs: apply-gateway-dev
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/_apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prd
      stack: foundation
      runner: ubuntu-latest

  apply-bootstrap-prd:
    needs: apply-gateway-dev
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/_apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prd
      stack: bootstrap
      runner: ubuntu-latest

  apply-serverless-prd:
    needs: [apply-prd, apply-bootstrap-prd]
    uses: ./.github/workflows/_apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prd
      stack: serverless
      runner: ubuntu-latest

  apply-runners-prd:
    needs: apply-prd
    uses: ./.github/workflows/_apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prd
      stack: runners
      runner: ubuntu-latest
      github_app: true

  apply-gateway-prd:
    needs: apply-serverless-prd
    uses: ./.github/workflows/_apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prd
      stack: gateway
      runner: ubuntu-latest
