name: Deploy

# Tag v*: checks, foundation + serverless dev, then foundation + serverless prd, then runners.
# Manual run from any branch: checks, foundation + serverless dev only.
# Applies stay on GitHub-hosted runners, independent of the infrastructure being changed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label (empty = RUNNER_LABEL variable, then ubuntu-latest)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  fmt:
    uses: ./.github/workflows/_fmt.yml
    with:
      runner: ${{ inputs.runner }}

  validate:
    uses: ./.github/workflows/_validate.yml
    with:
      runner: ${{ inputs.runner }}

  test:
    uses: ./.github/workflows/_test.yml
    with:
      runner: ${{ inputs.runner }}

  apply-dev:
    needs: [fmt, validate, test]
    uses: ./.github/workflows/_apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev
      stack: foundation
      runner: ubuntu-latest

  apply-serverless-dev:
    needs: apply-dev
    uses: ./.github/workflows/_apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev
      stack: serverless
      runner: ubuntu-latest

  apply-prd:
    needs: apply-serverless-dev
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/_apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prd
      stack: foundation
      runner: ubuntu-latest

  apply-serverless-prd:
    needs: apply-prd
    uses: ./.github/workflows/_apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prd
      stack: serverless
      runner: ubuntu-latest

  apply-runners-prd:
    needs: apply-serverless-prd
    uses: ./.github/workflows/_apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prd
      stack: runners
      runner: ubuntu-latest
      github_app: true
