name: Application tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  application:
    # Node/Java installation stays on a hosted runner until the self-hosted
    # image provides these prerequisites (no application workloads run on GKE).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache emulator downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/firebase.json') }}

      - name: Install dependencies from lockfile
        run: npm ci

      - name: TypeScript strict checks
        run: npm run typecheck

      - name: Unit tests and coverage threshold
        run: npm run test:coverage

      - name: Firestore and PubSub integration tests
        run: npm run test:integration

      # Same build as the serverless plans and applies (ADR-0009).
      - name: Build the functions
        run: npm run build:functions

      # Discord proxy in Go (ADR-0016): same reference cases as the TypeScript proxy
      # (testing/golden/discord-proxy.json, checked above by the unit tests).
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: app/go/discord-proxy/go.mod
          cache-dependency-path: app/go/discord-proxy/go.sum

      - name: Go proxy formatting, vet and tests
        working-directory: app/go/discord-proxy
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed: $unformatted"; exit 1; fi
          go vet ./...
          go test -race -cover ./...

      - name: Publish coverage in run summary
        if: always()
        run: node testing/coverage-summary.mjs

      - name: Upload coverage and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: application-test-reports
          path: |
            app/coverage/
            app/test-results/
          if-no-files-found: warn
          retention-days: 14
