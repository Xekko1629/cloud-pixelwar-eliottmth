name: Terraform plan

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (dev or prd)
        type: string
        required: true
      stack:
        description: Stack directory under infra/
        type: string
        default: foundation
      runner:
        description: Runner label (empty = RUNNER_LABEL variable, then ubuntu-latest)
        type: string
        default: ""

env:
  TF_VERSION: "1.17.0"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: plan ${{ inputs.stack }} (${{ inputs.environment }})
    runs-on: ${{ inputs.runner || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # "<env>-plan" holds the read-only planner identity, without approval rules
    environment: ${{ inputs.environment }}-plan
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: infra/${{ inputs.stack }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init
        run: terraform init -backend-config="backends/${{ inputs.environment }}.hcl"

      # No lock: the planner can only read the state bucket
      - name: Plan
        run: terraform plan -no-color -lock=false -var-file="${{ inputs.environment }}.tfvars" | tee plan.txt

      - name: Publish plan to run summary
        run: |
          {
            echo "## Plan \`${{ inputs.stack }}\` → \`${{ inputs.environment }}\`"
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
