name: Terraform test

on:
  workflow_call:
    inputs:
      stacks:
        description: JSON list of stack directories under infra/
        type: string
        default: '["foundation", "iam", "access", "runners", "bootstrap", "serverless", "gateway", "frontend", "serverless/modules/function", "serverless/modules/api-gateway", "serverless/modules/function-source", "serverless/modules/pubsub-topic", "serverless/modules/push-subscription"]'
      runner:
        description: Runner label (empty = RUNNER_MEDIUM variable, then ubuntu-latest)
        type: string
        default: ""

env:
  TF_VERSION: "1.17.0"

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.stack }})
    runs-on: ${{ inputs.runner || vars.RUNNER_MEDIUM || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(inputs.stacks) }}
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init without backend
        run: terraform init -backend=false -input=false

      # Runs the *.tftest.hcl files of the stack
      - name: Terraform test
        run: terraform test

      - name: Gateway migration guard regression tests
        if: matrix.stack == 'gateway'
        run: python3 ../../scripts/tests/test_gateway_migration.py

      - name: No-public check regression tests (SEC-01)
        if: matrix.stack == 'iam'
        run: python3 ../../scripts/tests/test_no_public.py
