name: CI

# PR from a feature branch to prod: checks, then plan dev + prd of the stacks the CI deploys
# (foundation, bootstrap, serverless). Nothing is applied. iam and access are applied by hand; runners
# are not planned, the read-only planner cannot read the Kubernetes secrets of Helm releases.
# Only the stacks whose directory changed are checked; "CI result" is the required check.
on:
  pull_request:
    branches: [prod]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # JSON list of changed stacks, e.g. ["foundation"] or []
      stacks: ${{ steps.filter.outputs.changes }}
    steps:
      # A workflow or .tflint.hcl change re-checks every stack
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            foundation:
              - 'infra/foundation/**'
              - '.github/workflows/**'
              - '.tflint.hcl'
            iam:
              - 'infra/iam/**'
              - '.github/workflows/**'
            access:
              - 'infra/access/**'
              - '.github/workflows/**'
              - '.tflint.hcl'
            bootstrap:
              - 'infra/bootstrap/**'
              - '.github/workflows/**'
            serverless:
              - 'infra/serverless/**'
              - '.github/workflows/**'
              # The plan zips the built functions: a code change is a redeployment.
              - 'app/functions/**'
              - 'app/shared/src/**'
              - 'app/package-lock.json'
            'serverless/modules/function':
              - 'infra/serverless/modules/function/**'
              - '.github/workflows/**'
            'serverless/modules/api-gateway':
              - 'infra/serverless/modules/api-gateway/**'
              - '.github/workflows/**'
            'serverless/modules/function-source':
              - 'infra/serverless/modules/function-source/**'
              - '.github/workflows/**'
            runners:
              - 'infra/runners/**'
              - '.github/workflows/**'
              - '.tflint.hcl'

  fmt:
    needs: changes
    if: needs.changes.outputs.stacks != '[]'
    uses: ./.github/workflows/_fmt.yml

  lint:
    needs: changes
    if: needs.changes.outputs.stacks != '[]'
    uses: ./.github/workflows/_lint.yml

  validate:
    needs: changes
    if: needs.changes.outputs.stacks != '[]'
    uses: ./.github/workflows/_validate.yml
    with:
      stacks: ${{ needs.changes.outputs.stacks }}

  test:
    needs: changes
    if: needs.changes.outputs.stacks != '[]'
    uses: ./.github/workflows/_test.yml
    with:
      stacks: ${{ needs.changes.outputs.stacks }}

  plan:
    needs: [changes, fmt, lint, validate, test]
    if: contains(fromJSON(needs.changes.outputs.stacks), 'foundation')
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prd]
    uses: ./.github/workflows/_plan.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ matrix.environment }}
      stack: foundation

  plan-serverless:
    needs: [changes, fmt, lint, validate, test]
    if: contains(fromJSON(needs.changes.outputs.stacks), 'serverless') || contains(fromJSON(needs.changes.outputs.stacks), 'serverless/modules/function') || contains(fromJSON(needs.changes.outputs.stacks), 'serverless/modules/api-gateway') || contains(fromJSON(needs.changes.outputs.stacks), 'serverless/modules/function-source')
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prd]
    uses: ./.github/workflows/_plan.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ matrix.environment }}
      stack: serverless

  plan-bootstrap:
    needs: [changes, fmt, lint, validate, test]
    if: contains(fromJSON(needs.changes.outputs.stacks), 'bootstrap')
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prd]
    uses: ./.github/workflows/_plan.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ matrix.environment }}
      stack: bootstrap

  application:
    uses: ./.github/workflows/_app-test.yml

  # Always reported, even when every other job is skipped: use it as the required status check
  result:
    name: CI result
    needs: [changes, fmt, lint, validate, test, plan, plan-serverless, plan-bootstrap, application]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Jobs results
        run: echo '${{ toJSON(needs) }}'

      - name: Fail if a job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
