# Each JSON key of the Secret Manager secret becomes a key of the Kubernetes secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.kubernetesSecret }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: {{ .Values.kubernetesSecret }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.secretManagerSecret }}
